
services:
  postgres:
    image: postgres:15-alpine
    container_name: news-postgres
    environment:
      POSTGRES_DB: newsmanagement
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: newspass123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - news-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=newsmanagement;Username=newsuser;Password=newspass123
      - JWT_SECRET_KEY=super-secret-development-key-change-in-production
      - JWT_ISSUER=NewsManagementSystem
      - JWT_AUDIENCE=NewsManagementSystem
      - UPLOAD_PATH=/app/uploads
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/src
      - uploads_data:/app/uploads
    networks:
      - news-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: news-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_UPLOAD_URL=http://localhost:5000/uploads
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - news-network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  news-network:
    driver: bridge